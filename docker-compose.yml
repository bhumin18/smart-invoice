services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      APP_DEBUG: "false"
      AUTH_ENABLED: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-password
      SECRET_KEY: change-this-secret-key
      DATABASE_ENGINE: sqlite
      SQLITE_DATABASE_PATH: database/db.sqlite3
    volumes:
      - backend_database:/app/database
      - backend_outputs:/app/outputs

  frontend:
    build:
      context: ./frontend/gst-gem-main
      args:
        VITE_API_BASE: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_database:
  backend_outputs:
